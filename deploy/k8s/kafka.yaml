apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controllers
  labels:
    strimzi.io/cluster: fbi-region-west
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: persistent-claim
    size: 50Gi
    class: fast-ssd
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: fbi-region-west
spec:
  replicas: 5
  roles: [broker]
  resources:
    requests: {cpu: "4", memory: 16Gi}
    limits: {cpu: "8", memory: 32Gi}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Ti
        class: fast-ssd
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: fbi-region-west
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.1.1
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false
      auto.create.topics.enable: false
      log.retention.hours: 72
      num.network.threads: 8
      num.io.threads: 16
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: fbi-warehouse-sink
  labels:
    strimzi.io/cluster: fbi-region-west
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: fineract.cdc., patternType: prefix}
        operations: [Read, Describe]
      - resource: {type: topic, name: fineract.cdc.dlt, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: fbi-warehouse-sink, patternType: literal}
        operations: [Read]
