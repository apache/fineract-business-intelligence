name: fineract_bi
version: 1.0.0
config-version: 2

profile: fineract_bi

model-paths:
  - models

macro-paths:
  - macros

test-paths:
  - tests

clean-targets:
  - target
  - dbt_packages

vars:
  tenant_id: "{{ env_var('TENANT_ID', 'default') }}"
  historical_start_date: "2025-01-01"
  future_end_date: "2035-12-31"
  snapshot_incremental_lookback_days: 120

models:
  fineract_bi:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: analytics
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
      presentations:
        +materialized: table
