name: fineract_bi
version: 1.0.0
config-version: 2

profile: fineract_bi

model-paths:
  - models

macro-paths:
  - macros

test-paths:
  - tests

packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

clean-targets:
  - target
  - dbt_packages

seed-paths:
  - seeds

vars:
  historical_start_date: "2025-01-01"
  future_end_date: "2035-12-31"
  snapshot_daily_retention_days: null
  analyze_raw_on_run_start: true
  heavy_model_disable_nestloop: true
  heavy_model_work_mem: "128MB"

on-run-start:
  - "{{ analyze_raw_sources() }}"

on-run-end:
  - "{{ advance_change_cursor(results) }}"

seeds:
  fineract_bi:
    +schema: analytics

models:
  fineract_bi:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: analytics
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
      presentations:
        +materialized: table
