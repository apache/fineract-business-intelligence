version: 2

models:
  - name: dim_client
    description: >
      Client dimension exposing pseudonymised attributes only.
      date_of_birth is excluded; age_band is the derived replacement.
      client_hash is the surrogate primary key safe for analytics use.
    columns:
      - name: client_hash
        description: Pseudonymised surrogate primary key (MD5 of tenant_id + client_id).
        tests:
          - not_null
          - unique

  - name: dim_office
    description: >
      Office hierarchy dimension.  office_level is derived from the
      dot-delimited hierarchy string.
    columns:
      - name: office_id
        description: Surrogate primary key.
        tests:
          - not_null
          - unique

  - name: dim_product
    description: Loan product dimension containing product templates and default terms.
    columns:
      - name: product_id
        description: Surrogate primary key.
        tests:
          - not_null
          - unique

  - name: dim_date
    description: >
      Conformed date dimension spanning historical_start_date to future_end_date.
      date_key is an integer in YYYYMMDD format for fast joins.
    columns:
      - name: date_key
        description: Integer surrogate key in YYYYMMDD format.
        tests:
          - not_null
          - unique

  - name: dim_delinquency_bucket
    description: >
      Delinquency bucket dimension with a synthetic bucket_key=0 row for
      'Current' (non-delinquent) loans.  Includes CGAP standard_par_band
      classification and sort_order for ordered reporting.
    columns:
      - name: bucket_key
        description: Surrogate primary key; 0 = Current, -1 reserved for rollups.
        tests:
          - not_null
          - unique

  - name: dim_currency
    description: Currency reference dimension.
    columns:
      - name: currency_code
        description: ISO 4217 currency code — primary key.
        tests:
          - not_null
          - unique

  - name: fact_loan_snapshot
    description: >
      Daily grain fact table capturing each active loan's delinquency
      status and outstanding balance per snapshot date.  Loaded
      incrementally with a 120-day lookback delete+insert strategy.
    columns:
      - name: snapshot_key
        description: MD5 surrogate key over (tenant_id, loan_id, snapshot_date).
        tests:
          - not_null
          - unique
      - name: snapshot_date
        description: The calendar date of this loan snapshot record.
        tests:
          - not_null
      - name: loan_id
        description: Foreign key to raw_m_loan.
        tests:
          - not_null
      - name: client_hash
        description: Pseudonymised client identifier.
        tests:
          - relationships:
              to: ref('dim_client')
              field: client_hash
      - name: office_id
        description: Foreign key to dim_office.
        tests:
          - relationships:
              to: ref('dim_office')
              field: office_id
      - name: product_id
        description: Foreign key to dim_product.
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: bucket_key
        description: Foreign key to dim_delinquency_bucket.
        tests:
          - relationships:
              to: ref('dim_delinquency_bucket')
              field: bucket_key

  - name: fact_delinquency_event
    description: >
      One row per delinquency tag event on a loan.  Includes previous
      bucket for migration matrix analysis and event duration in days.
    columns:
      - name: delinquency_event_key
        description: MD5 surrogate key over (tenant_id, delinquency_event_id).
        tests:
          - not_null
          - unique
      - name: loan_id
        description: Foreign key to raw_m_loan.
        tests:
          - not_null

  - name: mart_delinquency_par
    description: >
      Primary presentation mart for the Delinquency and PAR Dashboard.
      Contains CGAP-compliant cumulative PAR ratios, exclusive band
      amounts, NPA metrics, and average loan outstanding.  Rows are
      provided at both bucket-level grain and an 'All Portfolio' rollup
      (bucket_key = -1) per snapshot_date / office / product / currency.
    tests:
      - dbt_utils.expression_is_true:
          expression: "par_30_amount >= par_60_amount"
      - dbt_utils.expression_is_true:
          expression: "par_60_amount >= par_90_amount"
      - dbt_utils.expression_is_true:
          expression: "npa_amount <= total_portfolio_amount * 1.001"
    columns:
      - name: snapshot_date
        description: The calendar date of this reporting snapshot.
        tests:
          - not_null
      - name: office_id
        description: Foreign key to dim_office.
        tests:
          - not_null
          - relationships:
              to: ref('dim_office')
              field: office_id
      - name: product_id
        description: Foreign key to dim_product.
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: standard_par_band
        description: >
          CGAP-standard delinquency band label.  The visualization layer
          filters and colour-codes on these exact strings, so an unexpected
          value silently drops rows from every band-aware chart.
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Performing'
                - 'Watch-list'
                - 'PAR 30-59'
                - 'PAR 60-89'
                - 'PAR 90+'
                - 'All Portfolio'
      - name: par_30_ratio
        description: >
          Cumulative PAR 30 ratio (CGAP standard): outstanding principal
          of loans >= 30 DPD divided by total portfolio outstanding.
          Must be between 0 and 1, or null when portfolio is empty.
        tests:
          - not_null:
              config:
                where: "total_portfolio_amount > 0"

  - name: mart_portfolio_health
    description: >
      Presentation mart for the Portfolio Health Dashboard.  Provides a
      daily office / product / currency grain combining point-in-time
      stock metrics (gross loan portfolio, active loans, active borrowers,
      principal and interest outstanding, NPA and PAR exposure with their
      ratios, performing book) with same-day flow metrics (disbursement,
      collection, write-off).  All amount and count measures are additive
      across the office / product grain so portfolio-wide totals and
      ratios are recomputed by summation in the visualization layer; the
      seed gives each client a single loan so borrower counts remain exact.
    columns:
      - name: snapshot_date
        description: The calendar date of this reporting snapshot.
        tests:
          - not_null
      - name: office_id
        description: Foreign key to dim_office (the loan's booking office).
        tests:
          - not_null
          - relationships:
              to: ref('dim_office')
              field: office_id
      - name: product_id
        description: Foreign key to dim_product.
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: gross_loan_portfolio
        description: >
          Active principal outstanding (GLP) — the CGAP standard portfolio
          size measure.  Sum of principal_outstanding over active loans.
        tests:
          - not_null
      - name: npa_ratio
        description: >
          NPA outstanding principal divided by gross loan portfolio.
          Between 0 and 1, or null when the portfolio is empty.
        tests:
          - not_null:
              config:
                where: "gross_loan_portfolio > 0"

  - name: mart_repayment_behavior
    description: >
      Presentation mart for the Repayment Behavior Dashboard.  Provides a
      daily office / product / currency grain combining repayment transaction
      flow (amounts, component breakdown, borrower counts) with schedule-based
      behavioural signals (collection efficiency ratio, early / on-time / late
      payment counts, waiver amounts).  Grain is one row per
      (reporting_date, office_id, product_id, currency_code).
    tests:
      - dbt_utils.expression_is_true:
          expression: "repaying_borrower_count <= repayment_transaction_count"
      - dbt_utils.expression_is_true:
          expression: >
            principal_collected + interest_collected + fee_collected
            + penalty_collected + overpayment_collected
            <= actual_collected_amount * 1.001
      - dbt_utils.expression_is_true:
          expression: "overdue_penalty_waived <= overdue_penalty_charged * 1.001"
    columns:
      - name: reporting_date
        description: The calendar date of this repayment reporting record.
        tests:
          - not_null
      - name: office_id
        description: Foreign key to dim_office (the loan's booking office).
        tests:
          - not_null
          - relationships:
              to: ref('dim_office')
              field: office_id
      - name: product_id
        description: Foreign key to dim_product.
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: collection_efficiency_ratio
        description: >
          Actual collected amount divided by contractually due amount on the
          same date (spot-rate basis).  May exceed 1.0 on catch-up payment
          dates.  Null when nothing was due.
        tests:
          - not_null:
              config:
                where: "contractually_due_amount > 0"
      - name: on_time_payment_count
        description: >
          Installments where obligations_met_on_date equals duedate exactly.
          Uses Fineract's own LoanRepaymentScheduleInstallment tracking field,
          not a derived heuristic.
      - name: restructured_installment_count
        description: >
          Count of installments with is_re_aged = true.  Rising counts signal
          hidden restructuring volume that does not appear in PAR metrics.
      - name: overdue_penalty_charged
        description: >
          Total penalty charges auto-generated by Fineract's
          ChargeTimeType=OVERDUE_INSTALLMENT configuration on overdue
          installments.  Waived portion is in overdue_penalty_waived.
      - name: recovery_repayment_amount
        description: >
          Cash collected on written-off loans via RECOVERY_REPAYMENT
          transactions (transaction_type_enum=8).  Non-zero only when the
          institution partially recovers a charged-off loan.
